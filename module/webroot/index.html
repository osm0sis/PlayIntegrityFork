<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
<meta name="color-scheme" content="dark light" />
<title>Play Integrity Fork</title>
<style>
  :root{
    --bg:#000; --surface:#111114; --surface2:#1a1a20; --line:#26262e;
    --text:#eaeaef; --muted:#9a9aa6; --accent:#4d9fff; --accent-soft:#7cc4ff;
    --ok:#39d98a; --warn:#ffcc66; --err:#ff6b6b; --r:16px;
  }

  /* system light, unless the user forced dark */
  @media (prefers-color-scheme:light){
    :root:not([data-theme="dark"]){ --bg:#f5f5f8; --surface:#fff; --surface2:#eeeef2; --line:#e3e3ea;
      --text:#16161a; --muted:#65656f; --accent:#0a6cff; --accent-soft:#0a6cff; }
  }

  /* manual override */
  :root[data-theme="light"]{ --bg:#f5f5f8; --surface:#fff; --surface2:#eeeef2; --line:#e3e3ea;
    --text:#16161a; --muted:#65656f; --accent:#0a6cff; --accent-soft:#0a6cff; }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{
    background:var(--bg); color:var(--text);
    font-family:system-ui,-apple-system,Roboto,"Segoe UI",sans-serif; line-height:1.45;
    padding:max(env(safe-area-inset-top),14px) 16px calc(env(safe-area-inset-bottom) + 24px);
    -webkit-tap-highlight-color:transparent;
  }
  .wrap{max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
  header{display:flex;align-items:center;gap:12px;padding:2px}
  header svg{width:30px;height:30px;flex:0 0 auto}
  header h1{font-size:1.15rem;margin:0;font-weight:650}
  header .sub{font-size:.72rem;color:var(--muted);margin-top:1px}
  .grow{flex:1}
  .ic{background:none;border:none;color:var(--muted);font-size:1.35rem;cursor:pointer;padding:6px;border-radius:10px}
  .ic:active{background:var(--surface2)}

  .card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}

  /* status */
  .stat-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
  .stat-top .lbl{font-size:.72rem;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
  .badge{font-size:.72rem;font-weight:600;padding:3px 10px;border-radius:999px;border:1px solid var(--line);color:var(--muted)}
  .badge.custom{color:var(--ok);border-color:color-mix(in srgb,var(--ok) 40%,transparent)}
  .badge.canary{color:var(--accent-soft);border-color:color-mix(in srgb,var(--accent) 40%,transparent)}
  .fp{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.82rem;word-break:break-all;color:var(--text)}
  .meta{margin-top:8px;font-size:.76rem;color:var(--muted)}
  .dates{margin-top:8px;font-size:.76rem;color:var(--muted)}

  /* segmented mode switch */
  .seg{display:flex;background:var(--surface2);border-radius:12px;padding:4px;gap:4px}
  .seg button{flex:1;border:none;background:none;color:var(--muted);font-size:.9rem;font-weight:600;
    padding:11px;border-radius:9px;cursor:pointer;transition:.15s}
  .seg button.on{background:var(--accent);color:#03121f}
  .seg button:active{transform:scale(.98)}
  .hint{font-size:.75rem;color:var(--muted);margin:10px 2px 0}
  .util{display:flex;gap:10px;margin-top:14px}
  .util button{flex:1;background:var(--surface2);border:1px solid var(--line);color:var(--text);
    font-size:.84rem;font-weight:600;padding:10px;border-radius:11px;cursor:pointer}
  .util button:active{transform:scale(.98)}
  .util button.primary{background:var(--accent);color:#03121f;border-color:var(--accent)}
  button:disabled{opacity:.5;pointer-events:none}

  /* import */
  #filePicker{display:none}
  .import-flag{padding:6px 2px;margin:10px 0 4px}
  .input-base{width:100%;background:var(--surface2);border:1px solid var(--line);color:var(--text);padding:10px;border-radius:11px}
  .browse-btn{font-size:.85rem;font-weight:600;cursor:pointer;margin-bottom:15px}
  .custom-input{font-family:monospace;font-size:.8rem;margin-bottom:10px}
  .mt-0{margin-top:0}
  .mt-10{margin-top:10px}

  /* advanced */
  details>summary{cursor:pointer;list-style:none;display:flex;align-items:center;justify-content:space-between;
    font-size:.72rem;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
  details>summary::-webkit-details-marker{display:none}
  details>summary .chev{transition:.2s}
  details[open]>summary .chev{transform:rotate(180deg)}
  .flags{display:flex;flex-direction:column;gap:1px;margin-top:14px}
  .flag{display:flex;align-items:center;gap:12px;padding:11px 2px;font-size:.9rem;cursor:pointer}
  .flag+.flag{border-top:1px solid var(--line)}
  .flag>span:not(.sw){flex:1}
  .sw{position:relative;width:46px;height:27px;flex:0 0 auto;cursor:pointer}
  .sw input{display:none}
  .sw i{position:absolute;inset:0;background:var(--line);border-radius:999px;transition:.2s}
  .sw i::after{content:"";position:absolute;top:3px;left:3px;width:21px;height:21px;border-radius:50%;background:#fff;transition:.2s}
  .sw input:checked + i{background:var(--accent)}
  .sw input:checked + i::after{transform:translateX(19px)}
  .border-top{border-top:1px solid var(--line)}
  #verboseSelect{background:var(--surface2);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:6px 10px;font-weight:600;cursor:pointer;outline:none}

  /* output */
  #term{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:11px;margin-top:12px;
    font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.75rem;line-height:1.5;white-space:pre-wrap;
    word-break:break-word;max-height:200px;overflow:auto;color:var(--accent-soft)}
  #term .e{color:var(--err)} #term .g{color:var(--ok)} #term .w{color:var(--warn)} #term .m{color:var(--muted)}
  .spin{display:inline-block;width:12px;height:12px;border:2px solid currentColor;border-right-color:transparent;
    border-radius:50%;animation:sp .7s linear infinite;vertical-align:-1px;margin-left:6px}
  @keyframes sp{to{transform:rotate(360deg)}}

  /* modal editor */
  .modal-backdrop{position:fixed;top:0;left:0;right:0;height:100%;height:100dvh;background:rgba(0,0,0,.75);display:none;align-items:stretch;justify-content:center;padding:max(env(safe-area-inset-top),14px) 16px max(env(safe-area-inset-bottom),16px);z-index:100;overscroll-behavior:contain;touch-action:auto}
  .modal-backdrop.open{display:flex}
  .modal-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);width:100%;max-width:600px;height:100%;max-height:100%;display:flex;flex-direction:column;padding:14px;touch-action:auto}
  .modal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
  .modal-head .lbl{font-size:.78rem;font-weight:600;font-family:ui-monospace,Menlo,Consolas,monospace;color:var(--text)}
  .modal-area{user-select:text;flex:1;min-height:0;width:100%;background:var(--bg);color:var(--text);border:1px solid var(--line);border-radius:11px;padding:10px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.8rem;line-height:1.45;resize:none;outline:none;white-space:pre;overflow:auto;overscroll-behavior:contain}
  #confirmModal{align-items:center}
  .confirm-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);width:100%;max-width:340px;padding:16px;touch-action:auto}
  .confirm-msg{font-size:.92rem;color:var(--text);margin-bottom:14px}
</style>
</head>
<body>

<div class="wrap">
  <header>
    <svg viewBox="0 0 24 24" fill="none"><path d="M12 2l8 4v6c0 4.4-3.1 8.2-8 10-4.9-1.8-8-5.6-8-10V6l8-4z" fill="var(--accent-soft)" opacity=".16"/><path d="M12 2l8 4v6c0 4.4-3.1 8.2-8 10-4.9-1.8-8-5.6-8-10V6l8-4z" stroke="var(--accent-soft)" stroke-width="1.5"/><path d="M8.5 12.2l2.4 2.4 4.6-4.8" stroke="var(--accent-soft)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
    <div>
      <h1>Play Integrity Fork</h1>
      <div class="sub" id="ver"></div>
    </div>
    <div class="grow"></div>
    <button class="ic" id="theme" title="Theme">☾</button>
    <button class="ic" id="refresh" title="Refresh">⟳</button>
  </header>

  <div class="card">
    <div class="stat-top"><span class="lbl">Active Fingerprint</span><span class="badge" id="badge">—</span></div>
    <div class="fp" id="fp">Loading…</div>
    <div class="meta" id="meta"></div>
    <div class="dates" id="dates"></div>
  </div>

  <div class="card">
    <div class="stat-top"><span class="lbl">AutoPIF</span></div>
    <div class="seg" id="seg">
      <button data-mode="match" id="segMatch">Auto-Match Device (Default)</button>
      <button data-mode="random" id="segRandom">Force Random</button>
    </div>
    <div class="hint" id="hint"></div>
    <div class="util">
      <button id="generate">Generate</button>
      <button id="killPi">Kill PI Processes</button>
    </div>
  </div>

  <div class="card">
    <details id="impBox">
      <summary>Import Custom Print<span class="chev">▾</span></summary>
      <label class="flag import-flag">
        <span>Force migration to latest format</span>
        <span class="sw"><input type="checkbox" id="migrateForce"><i></i></span>
      </label>

      <div class="hint" style="margin:10px 0">Select a local .prop file via Android File Picker:</div>
      <input type="file" id="filePicker" onchange="handleFileSelect(event)">
      <button onclick="document.getElementById('filePicker').click()" class="input-base browse-btn">Browse Local Storage...</button>

      <div class="hint" style="margin:0 0 10px">Or download a .prop file via URL:</div>
      <input type="text" id="customPrintInput" placeholder="https://..." class="input-base custom-input">
      <div class="util mt-0">
        <button onclick="submitCustomUrl()">Apply From URL</button>
      </div>
    </details>
  </div>

  <div class="card">
    <details id="advBox">
      <summary>Advanced Settings<span class="chev">▾</span></summary>
      <div class="flags" id="flags"></div>

      <label class="flag border-top" id="skipAddPropRow">
        <span>Skip Property Addition</span>
        <span class="sw"><input type="checkbox" id="skipAddProp"><i></i></span>
      </label>
      <label class="flag border-top">
        <span>Skip Property Deletion</span>
        <span class="sw"><input type="checkbox" id="skipDelProp"><i></i></span>
      </label>
      <label class="flag border-top">
        <span>Skip Persist Property Changes</span>
        <span class="sw"><input type="checkbox" id="skipPersistProp"><i></i></span>
      </label>

      <div class="flag border-top" id="verboseRow">
        <span>Verbose Logs</span>
        <select id="verboseSelect">
          <option value="0">0 (Off)</option>
          <option value="1">1</option>
          <option value="2">2</option>
          <option value="3">3</option>
          <option value="100">100 (Max)</option>
        </select>
      </div>

      <div class="util mt-0">
        <button onclick="deletePropFile()">Remove</button>
        <button onclick="openPropEditor()">Manual Edit</button>
      </div>
      <div class="util mt-10">
        <button onclick="savePifLog()">Save PIF Logcat</button>
      </div>
    </details>
  </div>

  <div class="card">
    <details id="outBox">
      <summary>Output<span class="chev">▾</span></summary>
      <div id="term"><span class="m">Ready.<br></span></div>
    </details>
  </div>
</div>

<div class="modal-backdrop" id="editorModal">
  <div class="modal-card">
    <div class="modal-head">
      <span class="lbl">custom.pif.prop</span>
      <button class="ic" onclick="closePropEditor()" title="Close">✕</button>
    </div>
    <textarea id="propEditorArea" class="modal-area" spellcheck="false" autocomplete="off" autocorrect="off" autocapitalize="off"></textarea>
    <div class="util">
      <button onclick="closePropEditor()">Cancel</button>
      <button class="primary" onclick="savePropEditor()">Save</button>
    </div>
  </div>
</div>

<div class="modal-backdrop" id="confirmModal">
  <div class="confirm-card">
    <div class="confirm-msg" id="confirmMsg">Delete custom.pif.prop?</div>
    <div class="util mt-0">
      <button id="confirmNo">No</button>
      <button class="primary" id="confirmYes">Yes</button>
    </div>
  </div>
</div>

<script>
const MODID="playintegrityfix";
const MOD="/data/adb/modules/"+MODID;
const CFG=MOD+"/custom.pif.prop";
const MARK_SKIPMATCH=MOD+"/skipmatchdevice";
const MARK_SKIPADD=MOD+"/skipaddprop";
const MARK_SKIPDEL=MOD+"/skipdelprop";
const MARK_SKIPPERSIST=MOD+"/skippersistprop";
const FLAGS=["spoofBuild","spoofProps","spoofProvider","spoofSignature","spoofVendingFinger","spoofVendingSdk"];
const LABEL={spoofBuild:"Spoof Build",spoofProps:"Spoof Props",spoofProvider:"Spoof Provider",spoofSignature:"Spoof Signature",spoofVendingFinger:"Spoof Vending FINGERPRINT",spoofVendingSdk:"Spoof Vending SDK_INT",verboseLogs:"Verbose Logs"};

const $=s=>document.querySelector(s);
const term=$("#term");

function log(m,c){const s=document.createElement("span");if(c)s.className=c;s.textContent=m+"\n";term.appendChild(s);term.scrollTop=term.scrollHeight;}

function exec(cmd,opts){
  return new Promise((res,rej)=>{
    if(typeof ksu==="undefined"||!ksu.exec){rej(new Error("Root bridge (ksu.exec) unavailable"));return;}
    const cb="__cb_"+Date.now()+"_"+Math.floor(performance.now()*1000%1e6);
    window[cb]=(e,o,r)=>{delete window[cb];res({errno:Number(e)||0,stdout:o||"",stderr:r||""});};
    try{ksu.exec(cmd,JSON.stringify(opts||{}),cb);}catch(err){delete window[cb];rej(err);}
  });
}

function toast(m){try{if(typeof ksu!=="undefined"&&ksu.toast)ksu.toast(m);}catch(e){}}

function busy(b){document.querySelectorAll("button").forEach(x=>x.disabled=b);$("#refresh").disabled=false;}

async function readConfig(){
  const r=await exec(`cat ${CFG} 2>/dev/null`);const map={};
  (r.stdout||"").split("\n").forEach(l=>{
    const t=l.trim();if(!t)return;
    const commented=t.startsWith("#");const body=commented?t.replace(/^#+\s*/,""):t;
    const i=body.indexOf("=");if(i<0)return;
    map[body.slice(0,i).trim()]={value:body.slice(i+1).split("#")[0].trim(),commented};
  });return map;
}
const val=(m,k)=>m[k]?m[k].value:"";

async function refresh(){
  let map={},rand=false;
  try{map=await readConfig();}catch(e){log(e.message,"e");}
  try{rand=(await exec(`[ -f ${MARK_SKIPMATCH} ] && echo 1 || echo 0`)).stdout.trim()==="1";}catch(e){}

  let skipAdd = false, skipDel = false, skipPersist = false;
  try { skipAdd = (await exec(`[ -f ${MARK_SKIPADD} ] && echo 1 || echo 0`)).stdout.trim()==="1"; } catch(e){}
  try { skipDel = (await exec(`[ -f ${MARK_SKIPDEL} ] && echo 1 || echo 0`)).stdout.trim()==="1"; } catch(e){}
  try { skipPersist = (await exec(`[ -f ${MARK_SKIPPERSIST} ] && echo 1 || echo 0`)).stdout.trim()==="1"; } catch(e){}
  $("#skipAddProp").checked = skipAdd;
  $("#skipDelProp").checked = skipDel;
  $("#skipPersistProp").checked = skipPersist;

  const vLogs = map["verboseLogs"] ? map["verboseLogs"].value : "0";
  $("#verboseSelect").value = vLogs;

  const has=Object.keys(map).length>0;
  const fp=val(map,"FINGERPRINT");
  const isCanary=/^google\/.*CANARY/.test(fp);

  const badge=$("#badge");
  if(!has){badge.textContent="None";badge.className="badge";}
  else if(isCanary){badge.textContent="● Canary";badge.className="badge canary";}
  else{badge.textContent="● Custom";badge.className="badge custom";}

  $("#fp").textContent=has?fp:"No fingerprint — choose an option below.";
  const name=(val(map,"MANUFACTURER")+" "+val(map,"MODEL")).trim();
  const apiTarget=map["*api_level"]||map["ro.product.first_api_level"];
  const api=apiTarget?"First API "+apiTarget.value:"";
  const patchTarget=map["*.security_patch"]||map["ro.build.version.security_patch"];
  const patch=patchTarget?(patchTarget.commented?"Patch Commented":"Patch "+patchTarget.value):"";
  const releaseTest=await exec(`grep -oE 'Released:.*' ${CFG} | tr -d ':'`);
  const release=releaseTest.stdout.trim()?releaseTest.stdout.trim():"";
  const expiryTest=await exec(`grep -oE 'Estimated Expiry:.*' ${CFG} | tr -d ':'`);
  const expiry=expiryTest.stdout.trim()?expiryTest.stdout.trim():"";
  $("#meta").textContent=has?[name,api,patch].filter(Boolean).join("  ·  "):"";
  $("#dates").textContent=has?[release,expiry].filter(Boolean).join("  ·  "):"";

  $("#segMatch").classList.toggle("on",!rand);
  $("#segRandom").classList.toggle("on",rand);
  $("#hint").textContent=rand
    ?"Force a random Pixel Canary print regardless of device."
    :"Match Pixel Canary print on Beta/Canary Program supported Pixel devices, falling back to a random Pixel Canary print.";

  if(has){
    const fl=$("#flags");fl.innerHTML="";
    FLAGS.forEach(k=>{
      const v=map[k]?map[k].value:"";
      // Show advanced custom spoofVendingFinger and spoofVendingSdk values as enabled
      const on=(k==="spoofVendingFinger"||k==="spoofVendingSdk")?(v!==""&&v!=="0"):(v==="1");
      const el=document.createElement("label");el.className="flag";
      el.innerHTML=`<span>${LABEL[k]}</span><span class="sw"><input type="checkbox" ${on?"checked":""}><i></i></span>`;
      el.querySelector("input").addEventListener("change",e=>setFlag(k,e.target.checked?"1":"0"));
      fl.appendChild(el);
    });
  }
  $("#flags").style.display=has?"flex":"none";
  $("#skipAddPropRow").style.borderTop=has?"":"none";
  $("#verboseRow").style.display=has?"flex":"none";
}

async function autoPif(mode){
  busy(true);
  await refresh();
  $("#outBox").open=true;
  toast("Generating Canary fingerprint…");
  const args=(mode==="random")?"":"-m";
  log("\n# autopif4.sh "+args,"g");
  try{
    const r=await exec(`sh ${MOD}/autopif4.sh ${args} 2>&1`);
    (r.stdout||"").replace(/\n$/,"").split("\n").forEach(l=>log(l,/error|fail/i.test(l)?"e":(/warn/i.test(l)?"w":null)));
    log(r.errno===0?"✓ Canary fingerprint applied":"✗ exit "+r.errno,r.errno===0?"g":"e");
  } catch(e){log(e.message,"e");}
  await refresh();
  busy(false);
}

async function migrateCfg(args){
  log("\n# migrate.sh "+args,"g");
  try{
    const r=await exec(`sh ${MOD}/migrate.sh ${args} ${CFG} 2>&1`);
    (r.stdout||"").replace(/\n$/,"").split("\n").forEach(l=>log(l,null));
  } catch(e){log(e.message,"e");}
}

async function killPi(){
  log("\n# killpi.sh","g");
  try{
    const r=await exec(`sh ${MOD}/killpi.sh 2>&1`);
    (r.stdout||"").replace(/\n$/,"").split("\n").filter(Boolean).forEach(l=>log(l,null));
  } catch(e){log(e.message,"e");}
  log("✓ PI processes killed","g");
}

async function setMode(mode){
  try{
    if(mode==="random"){await exec(`touch ${MARK_SKIPMATCH}`);log("Create skipmatchdevice", "m");}
    else{await exec(`rm -f ${MARK_SKIPMATCH}`);log("Remove skipmatchdevice", "m");}
    await refresh();
  } catch(e){log(e.message,"e");}
}

async function setFlag(k,v){
  try{
    await exec(`sed -i "s;^[#[:space:]]*\\(${k}=\\).*;\\1${v};" ${CFG}`);
    const status = (k === "verboseLogs") ? v : (v === "1" ? "on" : "off");
    toast(`${LABEL[k] || k} ${status}`);
    log(`Set ${k}=${v}`,"m");
    await killPi();
  } catch(e){log(e.message,"e");}
}

async function handleFileSelect(event) {
  const file = event.target.files[0];
  if (!file) return;

  busy(true);
  await refresh();
  $("#outBox").open = true;
  toast("Reading fingerprint from file…");
  const reader = new FileReader();
  reader.onload = async function(e) {
    try {
      const text = e.target.result;
      // Base64 encode to safely pass file contents through the root shell
      const b64 = btoa(unescape(encodeURIComponent(text)));
      await exec(`echo "${b64}" | base64 -d > ${CFG}`);
      log(`Copied ${file.name} to ${CFG}`, "m");
      await migrateCfg($("#migrateForce").checked?"-p":"");
      await killPi();
      log(`✓ Local fingerprint applied`, "g");
    } catch(err){log(err.message,"e");}
    await refresh();
    busy(false);
    event.target.value = ""; // Reset picker
  };
  reader.readAsText(file);
}

async function submitCustomUrl() {
  let url = $("#customPrintInput").value.trim();
  if (!url || !url.startsWith("http")) {
    toast("Please enter a valid http/https URL.");
    return;
  }
  // Auto-convert standard GitHub blob links to raw.githubusercontent links
  if (url.includes("github.com") && url.includes("/blob/")) {
    url = url.replace("github.com", "raw.githubusercontent.com").replace("/blob/", "/");
  }

  busy(true);
  await refresh();
  $("#outBox").open = true;
  toast("Fetching fingerprint from URL…");
  try {
    const response = await fetch(url);
    if (!response.ok) throw new Error(`HTTP ${response.status}`);
    const text = await response.text();
    // Base64 encode to safely pass file contents through the root shell
    const b64 = btoa(unescape(encodeURIComponent(text)));
    await exec(`echo "${b64}" | base64 -d > ${CFG}`);
    log(`Downloaded ${url} to ${CFG}`, "m");
    await migrateCfg($("#migrateForce").checked?"-p":"");
    await killPi();
    log(`✓ URL fingerprint applied`, "g");
    $("#customPrintInput").value = "";
  } catch(err){log(`✗ Download failed: ${err.message}`, "e");}
  await refresh();
  busy(false);
}

function showConfirm(msg) {
  return new Promise(resolve => {
    const modal = $("#confirmModal");
    $("#confirmMsg").textContent = msg;
    modal.classList.add("open");
    document.body.style.overflow = "hidden";
    const done = (ok) => {
      modal.classList.remove("open");
      document.body.style.overflow = "";
      $("#confirmYes").onclick = null;
      $("#confirmNo").onclick = null;
      resolve(ok);
    };
    $("#confirmYes").onclick = () => done(true);
    $("#confirmNo").onclick = () => done(false);
  });
}

function scrollToActiveLine() {
  const ta = $("#propEditorArea");
  if (!ta || document.activeElement !== ta) return;
  const pos = ta.selectionStart || 0;
  const lineIndex = ta.value.slice(0, pos).split("\n").length - 1;
  const cs = getComputedStyle(ta);
  const lineHeight = parseFloat(cs.lineHeight) || (parseFloat(cs.fontSize) * 1.45);
  const targetTop = lineIndex * lineHeight - (ta.clientHeight / 2) + (lineHeight / 2);
  ta.scrollTop = Math.max(0, targetTop);
}

let editorBaseH = 0, editorBaseW = 0, editorKbdTimer = 0, editorKbdFallback = false, editorBtnDown = false;

function syncEditorViewport() {
  const modal = $("#editorModal");
  if (!modal.classList.contains("open")) return;
  const vv = window.visualViewport;
  const curW = vv ? vv.width : window.innerWidth;
  const curH = vv ? vv.height : window.innerHeight;
  if (Math.abs(curW - editorBaseW) > 50 || curH > editorBaseH) {
    editorBaseW = curW;
    editorBaseH = curH;
  }
  const hostResized = editorBaseH - curH > 100;
  if (hostResized) {
    clearTimeout(editorKbdTimer);
    editorKbdFallback = false;
  }
  const useFallback = editorKbdFallback && !hostResized;
  const targetH = Math.round(editorBaseH * (curW > curH ? 0.45 : 0.58));
  modal.style.top = (vv ? vv.offsetTop : 0) + "px";
  modal.style.height = curH + "px";
  modal.style.paddingBottom = useFallback ? Math.max(16, curH - targetH + 16) + "px" : "";
  if (document.activeElement === $("#propEditorArea")) {
    requestAnimationFrame(scrollToActiveLine);
  }
}

$("#editorModal").addEventListener("pointerdown", e => {
  if (e.target.closest("button")) editorBtnDown = true;
}, true);
window.addEventListener("pointerup", () => { editorBtnDown = false; }, true);
window.addEventListener("pointercancel", () => { editorBtnDown = false; }, true);

$("#propEditorArea").addEventListener("focus", () => {
  clearTimeout(editorKbdTimer);
  editorKbdTimer = setTimeout(() => { editorKbdFallback = true; syncEditorViewport(); }, 300);
});
$("#propEditorArea").addEventListener("blur", () => {
  clearTimeout(editorKbdTimer);
  editorKbdTimer = setTimeout(() => {
    if (editorBtnDown || !$("#editorModal").classList.contains("open")) return;
    editorKbdFallback = false;
    syncEditorViewport();
  }, 200);
});
if (window.visualViewport) {
  window.visualViewport.addEventListener("resize", syncEditorViewport);
  window.visualViewport.addEventListener("scroll", syncEditorViewport);
}
window.addEventListener("resize", syncEditorViewport);

async function openPropEditor() {
  try {
    const r = await exec(`cat ${CFG} 2>/dev/null`);
    $("#propEditorArea").value = r.stdout || "";
    const vv = window.visualViewport;
    editorBaseW = vv ? vv.width : window.innerWidth;
    editorBaseH = vv ? vv.height : window.innerHeight;
    editorKbdFallback = false;
    editorBtnDown = false;
    $("#editorModal").classList.add("open");
    document.body.style.overflow = "hidden";
    syncEditorViewport();
  } catch(e) {
    log(e.message, "e");
    toast("Failed to open file");
  }
}

function closePropEditor() {
  clearTimeout(editorKbdTimer);
  editorKbdFallback = false;
  editorBtnDown = false;
  const modal = $("#editorModal");
  modal.classList.remove("open");
  modal.style.top = "";
  modal.style.height = "";
  modal.style.paddingBottom = "";
  document.body.style.overflow = "";
}

async function savePropEditor() {
  let text = $("#propEditorArea").value;
  // Ensure the text ends with a newline character
  if (text && !text.endsWith("\n")) text += "\n";
  closePropEditor();
  busy(true);
  $("#outBox").open = true;
  try {
    await exec(`[ -f ${CFG} ] && cp -f ${CFG} ${CFG}.bak`);
    log(`Backed up ${CFG} to ${CFG}.bak`, "m");
    const b64 = btoa(unescape(encodeURIComponent(text)));
    await exec(`echo "${b64}" | base64 -d > ${CFG}`);
    log(`Saved manual edits to ${CFG}`, "m");
    await killPi();
    toast("Saved custom.pif.prop");
    log(`✓ custom.pif.prop updated`, "g");
  } catch(e) {
    log(e.message, "e");
    toast("Save failed");
  }
  await refresh();
  busy(false);
}

// theme: system by default, manual override persisted
function curTheme(){
  const t=document.documentElement.getAttribute("data-theme");
  if(t)return t;
  return (window.matchMedia&&matchMedia("(prefers-color-scheme: light)").matches)?"light":"dark";
}
function applyTheme(t){
  const root=document.documentElement;
  if(t==="light"||t==="dark")root.setAttribute("data-theme",t);else root.removeAttribute("data-theme");
  $("#theme").textContent=curTheme()==="light"?"☀":"☾";
}
try{applyTheme(localStorage.getItem("pif-theme"));}catch(e){applyTheme(null);}
$("#theme").onclick=()=>{const n=curTheme()==="light"?"dark":"light";try{localStorage.setItem("pif-theme",n);}catch(e){}applyTheme(n);};
